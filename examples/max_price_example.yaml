# Example: Using max_hourly_cost to control instance selection
#
# This example demonstrates how to use max_hourly_cost and max_hourly_cost_spot
# to limit the hourly cost of instances selected by SkyPilot.
#
# Tips for using max_hourly_cost:
#
# 1. Use max_hourly_cost for on-demand instance limits
# 2. Use max_hourly_cost_spot for spot instance limits
# 3. Combine both to support fallback (e.g., if spot unavailable, try on-demand)
# 4. Check current pricing: https://instances.vantage.sh/
# 5. If no instances are found, increase the limit or relax other constraints
# 6. The cost includes both compute and accelerator costs

# Example 1: Basic usage with max_hourly_cost
# This will only select instances that cost $2/hour or less
name: budget-training

resources:
  accelerators: V100:1
  max_hourly_cost: 2.0

setup: |
  echo "Running on an instance that costs at most $2/hour"

run: |
  python train.py

